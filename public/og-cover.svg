<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b2828"/>
      <stop offset="100%" stop-color="#a74541"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle top-right -->
  <circle cx="1100" cy="-80" r="340" fill="#ffffff" fill-opacity="0.04"/>
  <!-- Decorative circle bottom-left -->
  <circle cx="100" cy="750" r="280" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f87171" opacity="0.7"/>

  <!-- Icon background circle -->
  <circle cx="600" cy="220" r="88" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="600" cy="220" r="74" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Refresh/timer icon (scaled to center) -->
  <g transform="translate(556,176) scale(3.7)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 2v6h-6"/>
    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
    <path d="M3 22v-6h6"/>
    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
  </g>

  <!-- App name -->
  <text x="600" y="360" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">PomoQ</text>

  <!-- Tagline -->
  <text x="600" y="428" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#f8d7d7" fill-opacity="0.85" text-anchor="middle" letter-spacing="0.5">Estude com inteligência</text>


</svg>
